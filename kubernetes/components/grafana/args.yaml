version: 1.0.0

# Parameter definitions for the kubernetes/components/grafana component
# Typical variables: image.tag, grafana.ini.server.root_url, datasources, plugins, auth.google

parameters:
  components:
    grafana:
      namespace:
        type: string
        description: "Namespace to install Grafana"
        required: false
        default: "grafana"
      releaseName:
        type: string
        description: "Helm release name"
        required: false
        default: "grafana"
      valuesFiles:
        type: string
        description: "Space-separated values files. Use values.yaml values-override.yaml after rendering values-override.yaml.tmpl"
        required: false
        default: "values.yaml values-override.yaml"
      # Parameters for rendering values-override.yaml.tmpl
      imageTag:
        type: string
        description: "Grafana image tag"
        required: false
        default: "12.3.1"
      replicas:
        type: integer
        description: "Grafana replica count"
        required: false
        default: 1
      persistenceSize:
        type: string
        description: "PVC size for Grafana persistence"
        required: false
        default: "10Gi"
      vmDatasourceUrl:
        type: string
        description: "VictoriaMetrics datasource URL (Prometheus endpoint)"
        required: false
        default: "http://vmselect-victoriametrics-vmks.monitoring-vm.svc.cluster.local:8481/select/0/prometheus"
      lokiDatasourceUrl:
        type: string
        description: "Optional Loki datasource URL; leave empty to omit Loki (no Loki stack in template-one default)"
        required: false
        default: ""
      rootUrl:
        type: string
        description: "Grafana server root_url (e.g. https://example.com/grafana)"
        required: false
        default: "https://example.com/grafana"
      hostedDomain:
        type: string
        description: "Google auth hosted_domain"
        required: false
        default: "example.com"
      # The install script checks that helm/kubectl are installed; if set, it also enforces these minimum versions
      minHelmVersion:
        type: string
        description: "Minimum helm version required by install script (e.g. 3.0). Empty = only check presence"
        required: false
        default: ""
      minKubectlVersion:
        type: string
        description: "Minimum kubectl version required by install script (e.g. 1.24). Empty = only check presence"
        required: false
        default: ""
